[PHP]
display_errors = Off
display_startup_errors = Off
expose_php = Off

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; validate_timestamps=0 só é seguro porque em produção o código vem embutido na imagem
; (Dockerfile.prod), nunca por bind mount - cada deploy recria o container do zero.
opcache.validate_timestamps = 0
