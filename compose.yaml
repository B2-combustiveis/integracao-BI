services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 22000
    command: >
      sh -c "composer install --no-interaction
      && php artisan migrate --force
      && php artisan db:seed --force
      && PHP_CLI_SERVER_WORKERS=4 php -S 0.0.0.0:8000 -t public"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - bi-network

  db:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_WEBPOSTO_DATABASE: ${DB_WEBPOSTO_DATABASE:-webposto}
      MYSQL_BI_DATABASE: ${DB_BI_DATABASE:-bi}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 22000
    command: sh -c "composer install --no-interaction && php artisan queue:work --queue=financial,default --tries=3 --timeout=21700"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 9
    networks:
      - default
      - bi-network

  queue-clickhouse-heavy:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 7600
    command: sh -c "composer install --no-interaction && php artisan queue:work --queue=clickhouse-heavy --tries=1 --timeout=3600"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1
    networks:
      - default
      - bi-network

  queue-alterdata:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 1000
    command: sh -c "composer install --no-interaction && php artisan queue:work --queue=alterdata --tries=2 --timeout=900"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2
    networks:
      - default
      - bi-network

  queue-chimba:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 7600
    command: sh -c "composer install --no-interaction && php artisan queue:work --queue=chimba-reconciliation --tries=1 --timeout=6000"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2
    networks:
      - default
      - bi-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 7600
    command: sh -c "composer install --no-interaction && php artisan schedule:work"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - bi-network

networks:
  default: {}
  bi-network:
    external: true

volumes:
  mysql_data:
  vendor_data:
